<style>
/* ============ Design tokens ============ */
:root{
  --bg:#F3F4EF;
  --surface:#FFFFFF;
  --surface-2:#EAEDE5;
  --ink:#1B231F;
  --ink-soft:#5B675F;
  --ink-faint:#8C978E;
  --line:#D9DDD2;
  --line-strong:#C2C9B9;
  --primary:#0E6B57;
  --primary-dark:#0A5445;
  --primary-soft:#E1EFE9;
  --accent:#C2701F;
  --accent-soft:#F6E9D8;
  --danger:#B03A2E;
  --danger-soft:#F7E4E1;
  --ok:#1E7D47;
  --radius-s:4px;
  --radius-m:8px;
  --shadow-1: 0 1px 2px rgba(20,30,24,0.06), 0 1px 1px rgba(20,30,24,0.04);
  --font: 'Noto Sans KR','Noto Sans',sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#141815;
    --surface:#1C211D;
    --surface-2:#242A24;
    --ink:#EDF1EA;
    --ink-soft:#AEB8AC;
    --ink-faint:#7A857B;
    --line:#323930;
    --line-strong:#3E463C;
    --primary:#3FAE8E;
    --primary-dark:#2E8F73;
    --primary-soft:#1D3129;
    --accent:#E0995A;
    --accent-soft:#3A2E1D;
    --danger:#E17A6C;
    --danger-soft:#3A2320;
    --ok:#5CC98A;
  }
}
:root[data-theme="dark"]{
  --bg:#141815;
  --surface:#1C211D;
  --surface-2:#242A24;
  --ink:#EDF1EA;
  --ink-soft:#AEB8AC;
  --ink-faint:#7A857B;
  --line:#323930;
  --line-strong:#3E463C;
  --primary:#3FAE8E;
  --primary-dark:#2E8F73;
  --primary-soft:#1D3129;
  --accent:#E0995A;
  --accent-soft:#3A2E1D;
  --danger:#E17A6C;
  --danger-soft:#3A2320;
  --ok:#5CC98A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
  min-height:100%;
}
#app{max-width:1180px; margin:0 auto; padding:16px 16px 64px;}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---- header ---- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:14px 0 10px; margin-bottom:8px;
  border-bottom:1px solid var(--line);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand .mark{
  width:10px;height:10px;border-radius:2px;background:var(--primary); display:inline-block;
  transform: rotate(45deg); flex-shrink:0;
}
.brand h1{font-size:17px;}
.brand small{color:var(--ink-faint); font-size:12px; font-weight:500;}
.lang-toggle{
  display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px;
  border:1px solid var(--line);
}
.lang-toggle button{
  border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:12.5px;
  font-weight:600; color:var(--ink-soft);
}
.lang-toggle button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-1);}
.tabs{display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
.tabs button{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap;
  transition:.12s;
}
.tabs button.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}
:root[data-theme="dark"] .tabs button.active, .tabs button.active { background:var(--primary); border-color:var(--primary); color:#fff;}

/* ---- layout helpers ---- */
.section{margin-top:18px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
.section-head h2{font-size:15px;}
.muted{color:var(--ink-faint); font-size:12.5px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px; box-shadow:var(--shadow-1);
}
.grid{display:grid; gap:12px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:720px){ .grid.cols-2, .grid.cols-3{grid-template-columns:1fr;} }

/* ---- form elements ---- */
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  border-radius:var(--radius-s); padding:9px 10px; font-size:14.5px; width:100%;
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
.field .hint{font-size:11.5px; color:var(--ink-faint);}
.field-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px;}

.btn{
  border-radius:var(--radius-s); border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink); padding:9px 16px; font-size:13.5px; font-weight:600;
}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-soft);}
.btn.danger{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.small{padding:5px 10px; font-size:12px;}

.category-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.category-tabs button{
  border:1px solid var(--line); background:var(--surface); padding:9px 14px; border-radius:var(--radius-s);
  font-size:13px; font-weight:600; color:var(--ink-soft); border-left:3px solid transparent;
}
.category-tabs button.active{border-left-color:var(--primary); color:var(--ink); background:var(--primary-soft);}

.entry-table{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px;}
.entry-table th,.entry-table td{padding:8px 9px; border-bottom:1px solid var(--line); text-align:right;}
.entry-table th:first-child,.entry-table td:first-child{text-align:left;}
.entry-table th{color:var(--ink-faint); font-weight:600; font-size:11.5px; text-transform:none;}
.entry-table tbody tr:hover{background:var(--surface-2);}
.pill{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--surface-2); font-size:11px; font-weight:600; color:var(--ink-soft);}
.pill.warn{background:var(--accent-soft); color:var(--accent);}

.empty-row{color:var(--ink-faint); font-size:13px; padding:18px 4px; text-align:center;}

/* ---- summary cards ---- */
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; box-shadow:var(--shadow-1);}
.stat-card .label{font-size:12px; color:var(--ink-faint); font-weight:600; margin-bottom:4px;}
.stat-card .value{font-size:22px; font-weight:700; letter-spacing:-0.02em;}
.stat-card .sub{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.progress-bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px;}
.progress-bar > div{height:100%; background:var(--primary); border-radius:99px;}

.case-card{border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); padding:14px; box-shadow:var(--shadow-1);}
.case-card .case-title{font-size:13.5px; font-weight:700; margin-bottom:2px;}
.case-card .case-updated{font-size:11px; color:var(--ink-faint); margin-bottom:10px;}
.mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px 10px; font-size:12.5px;}
.mini-grid div.k{color:var(--ink-faint);}
.mini-grid div.v{font-weight:700; text-align:right;}
.mini-grid div.k.wide{grid-column:1 / -1; margin-top:2px; padding-top:5px; border-top:1px dashed var(--line);}

.target-edit{display:flex; align-items:center; gap:6px;}
.target-edit input{width:96px; text-align:right;}

/* ---- report view ---- */
#reportCapture{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:24px; box-shadow:var(--shadow-1);}
.report-title{font-size:19px; font-weight:800; margin-bottom:2px;}
.report-date{font-size:12.5px; color:var(--ink-faint); margin-bottom:18px;}
.report-block{margin-bottom:18px;}
.report-block h3{font-size:13.5px; margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid var(--ink);}
table.report-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:520px;}
table.report-table th,table.report-table td{border:1px solid var(--line); padding:6px 8px; text-align:right;}
table.report-table th:first-child,table.report-table td:first-child{text-align:left;}
table.report-table th{background:var(--surface-2); font-weight:700;}
table.report-table tr.total-row td{font-weight:700; background:var(--surface-2);}
tr.total-row td{font-weight:700; background:var(--surface-2);}
.report-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:820px){ .report-cols{grid-template-columns:1fr;} }
.report-col-title{font-size:13px; font-weight:700; margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid var(--ink);}
table.vtable{width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed;}
table.vtable th{text-align:left; font-weight:600; color:var(--ink-soft); padding:8px 4px; border-bottom:1px solid var(--line); white-space:nowrap; width:42%;}
table.vtable td{text-align:right; font-weight:700; padding:8px 4px; border-bottom:1px solid var(--line);}
table.vtable tr:last-child th, table.vtable tr:last-child td{border-bottom:none;}
table.vtable tr.emphasis th, table.vtable tr.emphasis td{color:var(--primary);}

/* ---- modal / toast ---- */
.overlay{position:fixed; inset:0; background:rgba(10,14,11,0.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal{background:var(--surface); border-radius:var(--radius-m); max-width:420px; width:100%; padding:20px; box-shadow:0 12px 32px rgba(0,0,0,.25);}
.modal p{font-size:13.5px; line-height:1.55; color:var(--ink-soft); margin:8px 0 18px;}
.modal .modal-actions{display:flex; justify-content:flex-end; gap:8px;}
.toast{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
  z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.db-warning{
  background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); border-radius:var(--radius-s);
  padding:10px 14px; font-size:12.5px; margin-bottom:14px;
}
.skeleton{color:var(--ink-faint); font-size:13px; padding:24px; text-align:center;}
</style>
</head>

/* ----------------------------- utils --------------------------------- */
function pad2(n) { return String(n).padStart(2, "0"); }
function toDateStr(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return toDateStr(d);
}
function todayStr() { return toDateStr(new Date()); }
function fmtDateShort(dateStr, lang) {
  if (!dateStr) return "-";
  const [y, m, d] = dateStr.split("-");
  return lang === "vi" ? `${d}/${m}` : `${m}/${d}`;
}
function numFmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Math.round(n).toLocaleString("en-US");
}
function pct(a, b) {
  if (!b || b <= 0) return null;
  return (a / b) * 100;
}
function sanitizeIdPart(s) {
  return String(s || "").trim().replace(/[^A-Za-z0-9_\-.~:@+가-힣]/g, "-").slice(0, 60) || "x";
}
function t(key) { return (I18N[STATE.lang] && I18N[STATE.lang][key]) || key; }
function localName(obj) { return STATE.lang === "vi" ? obj.vi : obj.ko; }
function caseById(list, id) { return list.find(c => c.id === id); }

function showToast(msg) {
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 2200);
}

function showModal({ title, body, confirmText, cancelText, onConfirm, danger }) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <p>${body}</p>
      <div class="modal-actions">
        <button class="btn" data-act="cancel">${cancelText}</button>
        <button class="btn ${danger ? "danger" : "primary"}" data-act="confirm">${confirmText}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay || e.target.dataset.act === "cancel") { overlay.remove(); }
    else if (e.target.dataset.act === "confirm") { overlay.remove(); onConfirm(); }
  });
}

/* ------------------------- server API layer ----------------------------- */
async function apiFetchAll() {
  const res = await fetch("api/all", { cache: "no-store" });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

async function refreshFromServer() {
  try {
    const data = await apiFetchAll();
    CACHE.production_normal = data.production_normal || {};
    CACHE.production_decap = data.production_decap || {};
    CACHE.pmSelection = data.pmSelection || [];
    CACHE.sortRework = data.sortRework || [];
    CACHE.shipment = data.shipment || [];
    CACHE.targets = data.targets || {};
    CACHE.report = data.report || { comment: "" };
    STATE.dbReady = true;
  } catch (e) {
    STATE.dbReady = false;
  }
  render();
}

/* Polls the server periodically so other people's entries show up without
   a manual refresh. 20s is a reasonable balance for a small internal tool;
   raise the interval if this ever runs on a slow link. */
async function initDb() {
  await refreshFromServer();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshFromServer, 20000);
}

async function dbSet(collection, docId, data) {
  try {
    const res = await fetch("api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ collection, doc_id: docId, data }),
    });
    if (!res.ok) throw new Error("save failed: " + res.status);
    await refreshFromServer();
    return true;
  } catch (e) {
    showToast(t("db_unavailable"));
    return false;
  }
}

async function dbDelete(collection, docId) {
  try {
    const res = await fetch("api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ collection, doc_id: docId }),
    });
    if (!res.ok) throw new Error("delete failed: " + res.status);
    await refreshFromServer();
    return true;
  } catch (e) {
    showToast(t("db_unavailable"));
    return false;
  }
}

async function dbSetDoc(path, data) {
  const parts = path.split("/");
  return dbSet(parts[0], parts[1], data);
}

/* Plain browser download — works on any normal web page, no special
   platform capability needed. */
function browserDownload(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function pmCumulativeLt23(pmByCase) {
  let sum = 0;
  PM_CASES.forEach(c => { sum += (pmByCase[c.id] && pmByCase[c.id].buckets.lt23) || 0; });
  return sum;
}

/* --------------------------- aggregation -------------------------------- */
function aggProduction(map) {
  let sumInput = 0, sumOk = 0, lastDate = null;
  Object.keys(map).forEach(date => {
    const rec = map[date];
    if (!rec) return;
    sumInput += Number(rec.input) || 0;
    sumOk += Number(rec.ok) || 0;
    if (!lastDate || date > lastDate) lastDate = date;
  });
  return { sumInput, sumOk, lastDate };
}

function aggPmSelectionByCase() {
  const result = {};
  PM_CASES.forEach(c => { result[c.id] = { input: 0, scrap: 0, buckets: { ge34: 0, r30_34: 0, r28_30: 0, r25_28: 0, r23_25: 0, lt23: 0 }, lastDate: null }; });
  CACHE.pmSelection.forEach(rec => {
    const bucket = result[rec.caseId];
    if (!bucket) return;
    bucket.input += Number(rec.input) || 0;
    bucket.scrap += Number(rec.scrap) || 0;
    PM_BUCKETS.forEach(b => { bucket.buckets[b.id] += Number(rec.buckets && rec.buckets[b.id]) || 0; });
    if (!bucket.lastDate || rec.date > bucket.lastDate) bucket.lastDate = rec.date;
  });
  return result;
}

function aggSortReworkByCase() {
  const result = {};
  REWORK_CASES.forEach(c => {
    result[c.id] = { input: 0, ok: 0, lastDate: null, byRange: {} };
    PM_RANGES.forEach(r => { result[c.id].byRange[r.id] = { input: 0, ok: 0 }; });
  });
  CACHE.sortRework.forEach(rec => {
    const bucket = result[rec.caseId];
    if (!bucket) return;
    bucket.input += Number(rec.input) || 0;
    bucket.ok += Number(rec.ok) || 0;
    if (!bucket.lastDate || rec.date > bucket.lastDate) bucket.lastDate = rec.date;
    if (bucket.byRange[rec.pmRange]) {
      bucket.byRange[rec.pmRange].input += Number(rec.input) || 0;
      bucket.byRange[rec.pmRange].ok += Number(rec.ok) || 0;
    }
  });
  return result;
}

function aggShipment() {
  const byType = {};
  SHIPMENT_TYPES.forEach(ty => { byType[ty.id] = { normal: 0, resort67: 0, decapRework: 0, sortRework: 0, total: 0 }; });
  let lastDate = null;
  CACHE.shipment.forEach(rec => {
    const b = byType[rec.type];
    if (!b) return;
    b.normal += Number(rec.normal) || 0;
    b.resort67 += Number(rec.resort67) || 0;
    b.decapRework += Number(rec.decapRework) || 0;
    b.sortRework += Number(rec.sortRework) || 0;
    if (!lastDate || rec.date > lastDate) lastDate = rec.date;
  });
  Object.keys(byType).forEach(k => {
    const b = byType[k];
    b.total = b.normal + b.resort67 + b.decapRework + b.sortRework;
  });
  const grand = { normal: 0, resort67: 0, decapRework: 0, sortRework: 0, total: 0 };
  Object.values(byType).forEach(b => {
    grand.normal += b.normal; grand.resort67 += b.resort67; grand.decapRework += b.decapRework;
    grand.sortRework += b.sortRework; grand.total += b.total;
  });
  return { byType, grand, lastDate };
}

/* 선별 리웍 대상수는 해당 PM 구간에서 P/M 선별로 판정된 누적 수량에서 자동 계산됩니다
   (원본 엑셀의 Summary!C30=G8 방식과 동일). */
function reworkRangeTargets(pmByCase) {
  const out = {};
  PM_RANGES.forEach(r => {
    let sum = 0;
    PM_CASES.forEach(c => { sum += pmByCase[c.id].buckets[r.id] || 0; });
    out[r.id] = sum;
  });
  return out;
}

function renderReworkSummaryTables(pmByCase, rwByCase) {
  const rangeTargets = reworkRangeTargets(pmByCase);
  const rangeInput = {}, rangeOk = {};
  PM_RANGES.forEach(r => {
    let inp = 0, ok = 0;
    REWORK_CASES.forEach(c => { inp += rwByCase[c.id].byRange[r.id].input; ok += rwByCase[c.id].byRange[r.id].ok; });
    rangeInput[r.id] = inp; rangeOk[r.id] = ok;
  });
  const totalTarget = Object.values(rangeTargets).reduce((a, b) => a + b, 0);
  const totalInput = Object.values(rangeInput).reduce((a, b) => a + b, 0);
  const totalOk = Object.values(rangeOk).reduce((a, b) => a + b, 0);
  const colgroup = `<colgroup><col style="width:24%"><col><col><col><col><col></colgroup>`;

  return `
  <div class="card" style="overflow-x:auto;margin-bottom:12px;">
    <table class="entry-table" style="table-layout:fixed;">
      ${colgroup}
      <thead><tr><th></th>${PM_RANGES.map(r => `<th>${localName(r)}</th>`).join("")}<th>${t("grand_total")}</th></tr></thead>
      <tbody>
        <tr><td>${t("target_qty")}</td>${PM_RANGES.map(r => `<td>${numFmt(rangeTargets[r.id])}</td>`).join("")}<td>${numFmt(totalTarget)}</td></tr>
        <tr><td>${t("field_input")}</td>${PM_RANGES.map(r => `<td>${numFmt(rangeInput[r.id])}</td>`).join("")}<td>${numFmt(totalInput)}</td></tr>
        <tr class="total-row"><td>${t("progress_label")}</td>${PM_RANGES.map(r => {
          const p = rangeTargets[r.id] ? pct(rangeInput[r.id], rangeTargets[r.id]) : null;
          return `<td>${p !== null ? p.toFixed(1) + "%" : "-"}</td>`;
        }).join("")}<td>${totalTarget ? pct(totalInput, totalTarget).toFixed(1) + "%" : "-"}</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card" style="overflow-x:auto;">
    <table class="entry-table" style="table-layout:fixed;">
      ${colgroup}
      <thead><tr><th>${t("field_case")}</th>${PM_RANGES.map(r => `<th>${localName(r)}</th>`).join("")}<th>${t("grand_total")}</th></tr></thead>
      <tbody>
      ${REWORK_CASES.map(c => {
        const a = rwByCase[c.id];
        return `<tr><td>${localName(c)}</td>${PM_RANGES.map(r => `<td>${numFmt(a.byRange[r.id].ok)}/${numFmt(a.byRange[r.id].input)}</td>`).join("")}<td>${numFmt(a.ok)}/${numFmt(a.input)}</td></tr>`;
      }).join("")}
      <tr class="total-row"><td>${t("grand_total")}</td>${PM_RANGES.map(r => `<td>${numFmt(rangeOk[r.id])}/${numFmt(rangeInput[r.id])}</td>`).join("")}<td>${numFmt(totalOk)}/${numFmt(totalInput)}</td></tr>
      </tbody>
    </table>
    <div class="hint" style="margin-top:8px;">OK / Input</div>
  </div>
  `;
}

function renderPmTotalCard(pmByCase, targets) {
  let input = 0, scrap = 0, target = 0;
  const buckets = { ge34: 0, r30_34: 0, r28_30: 0, r25_28: 0, r23_25: 0, lt23: 0 };
  let lastDate = null;
  PM_CASES.forEach(c => {
    const a = pmByCase[c.id];
    input += a.input; scrap += a.scrap; target += Number(targets["pm_" + c.id]) || 0;
    PM_BUCKETS.forEach(b => { buckets[b.id] += a.buckets[b.id]; });
    if (a.lastDate && (!lastDate || a.lastDate > lastDate)) lastDate = a.lastDate;
  });
  const okAbove25 = buckets.ge34 + buckets.r30_34 + buckets.r28_30 + buckets.r25_28;
  const p = target ? pct(input + scrap, target) : null;
  return `
  <div class="case-card" style="border-color:var(--primary);background:var(--primary-soft);">
    <div class="case-title">${t("pm_total_title")}</div>
    <div class="case-updated">${t("last_updated")}: ${lastDate ? fmtDateShort(lastDate, STATE.lang) : t("no_data_yet")}</div>
    <div class="mini-grid">
      <div class="k">Input</div><div class="v">${numFmt(input)}</div>
      <div class="k">PM≥25</div><div class="v">${numFmt(okAbove25)}</div>
      <div class="k">23~25</div><div class="v">${numFmt(buckets.r23_25)}</div>

    ${scrap ? `<div class="sub" style="margin-top:6px;">${t("scrap_cumulative")}: ${numFmt(scrap)}</div>` : ""}
  </div>`;
}

/* ============================ Report view ================================ */
function renderReportView() {
  const prodNormal = aggProduction(CACHE.production_normal);
  const prodDecap = aggProduction(CACHE.production_decap);
  const pmByCase = aggPmSelectionByCase();
  const rwByCase = aggSortReworkByCase();
  const ship = aggShipment();
  const targets = CACHE.targets || {};

  let pmTotalInput = 0, pmTotalGe25 = 0, pmTotal23_25 = 0, pmTotalLt23 = 0, pmTargetTotal = 0, pmTotalScrap = 0, pmLastDate = null;
  PM_CASES.forEach(c => {
    const a = pmByCase[c.id];
    pmTotalInput += a.input;
    pmTotalScrap += a.scrap || 0;
    pmTotalGe25 += a.buckets.ge34 + a.buckets.r30_34 + a.buckets.r28_30 + a.buckets.r25_28;
    pmTotal23_25 += a.buckets.r23_25;
    pmTotalLt23 += a.buckets.lt23;
    pmTargetTotal += Number(targets["pm_" + c.id]) || 0;
    if (a.lastDate && (!pmLastDate || a.lastDate > pmLastDate)) pmLastDate = a.lastDate;
  });
  // 폐기는 rework 자체가 불가능하므로 보고용 대상수/진척률 계산에서 제외합니다.
  const pmTargetReport = Math.max(0, pmTargetTotal - pmTotalScrap);
  const pmProgress = pmTargetReport > 0 ? pct(pmTotalInput, pmTargetReport) : null;

  let rwLastDate = null;
  REWORK_CASES.forEach(c => {
    const a = rwByCase[c.id];
    if (a.lastDate && (!rwLastDate || a.lastDate > rwLastDate)) rwLastDate = a.lastDate;
  });
  const rangeTargets = reworkRangeTargets(pmByCase);
  const rwTargetTotal = Object.values(rangeTargets).reduce((a, b) => a + b, 0);
  let rwTotalInput = 0, rwTotalOk = 0;
  REWORK_CASES.forEach(c => { rwTotalInput += rwByCase[c.id].input; rwTotalOk += rwByCase[c.id].ok; });
  const rwProgress = rwTargetTotal > 0 ? pct(rwTotalInput, rwTargetTotal) : null;
  const rwOkPct = rwTotalInput > 0 ? pct(rwTotalOk, rwTotalInput) : null;
  const rwNgPct = rwTotalInput > 0 ? pct(Math.max(0, rwTotalInput - rwTotalOk), rwTotalInput) : null;

  const decapTarget = (Number(targets.decap) || 0) + pmTotalLt23;
  const decapProgress = decapTarget ? pct(prodDecap.sumInput, decapTarget) : null;
  const decapOkPct = prodDecap.sumInput > 0 ? pct(prodDecap.sumOk, prodDecap.sumInput) : null;
  const decapNgPct = prodDecap.sumInput > 0 ? pct(Math.max(0, prodDecap.sumInput - prodDecap.sumOk), prodDecap.sumInput) : null;
  const pmGe25Pct = pmTotalInput > 0 ? pct(pmTotalGe25, pmTotalInput) : null;
  const pm2325Pct = pmTotalInput > 0 ? pct(pmTotal23_25, pmTotalInput) : null;
  const pmLt23Pct = pmTotalInput > 0 ? pct(pmTotalLt23, pmTotalInput) : null;

  const dates = [prodNormal.lastDate, prodDecap.lastDate, pmLastDate, rwLastDate, ship.lastDate].filter(Boolean);
  const asOf = dates.length ? dates.slice().sort().slice(-1)[0] : null;

  return `
  <div class="section">
    <div class="section-head">
      <h2>${t("nav_report")}</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn" data-action="export-image">${t("export_image_btn")}</button>
        <button class="btn" data-action="export-excel">${t("export_excel_btn")}</button>
      </div>
    </div>
    <div id="reportCapture">
      <div class="report-title">${t("report_title")}</div>
      <div class="report-date">${t("report_asof")}: ${asOf ? asOf : "-"}</div>

      <div class="report-block">
        <div class="report-cols">
          <div>
            <div class="report-col-title">${t("report_pm_section")}</div>
            <table class="vtable">
              <tr><th>${t("target_qty")}</th><td>${pmTargetReport ? numFmt(pmTargetReport) : "-"}</td></tr>
              <tr><th>${t("inspected_qty")}</th><td>${numFmt(pmTotalInput)}</td></tr>
              <tr class="emphasis"><th>${t("progress_label")}</th><td>${pmProgress !== null ? pmProgress.toFixed(1) + "%" : "-"}</td></tr>
              <tr><th>PM≥25</th><td>${numFmt(pmTotalGe25)}${pmGe25Pct !== null ? ` (${pmGe25Pct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th>23~25</th><td>${numFmt(pmTotal23_25)}${pm2325Pct !== null ? ` (${pm2325Pct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th>&lt;23</th><td>${numFmt(pmTotalLt23)}${pmLt23Pct !== null ? ` (${pmLt23Pct.toFixed(1)}%)` : ""}</td></tr>
            </table>
          </div>
          <div>
            <div class="report-col-title">${t("report_decap_section")}</div>
            <table class="vtable">
              <tr><th>${t("target_qty")}</th><td>${decapTarget ? numFmt(decapTarget) : "-"}</td></tr>
              <tr><th>Input</th><td>${numFmt(prodDecap.sumInput)}</td></tr>
              <tr class="emphasis"><th>${t("progress_label")}</th><td>${decapProgress !== null ? decapProgress.toFixed(1) + "%" : "-"}</td></tr>
              <tr><th>OK</th><td>${numFmt(prodDecap.sumOk)}${decapOkPct !== null ? ` (${decapOkPct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th>NG</th><td>${numFmt(Math.max(0, prodDecap.sumInput - prodDecap.sumOk))}${decapNgPct !== null ? ` (${decapNgPct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th></th><td></td></tr>
            </table>
          </div>
          <div>
            <div class="report-col-title">${t("report_rework_section")}</div>
            <table class="vtable">
              <tr><th>${t("target_qty")}</th><td>${rwTargetTotal ? numFmt(rwTargetTotal) : "-"}</td></tr>
              <tr><th>Input</th><td>${numFmt(rwTotalInput)}</td></tr>
              <tr class="emphasis"><th>${t("progress_label")}</th><td>${rwProgress !== null ? rwProgress.toFixed(1) + "%" : "-"}</td></tr>
              <tr><th>OK</th><td>${numFmt(rwTotalOk)}${rwOkPct !== null ? ` (${rwOkPct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th>NG</th><td>${numFmt(Math.max(0, rwTotalInput - rwTotalOk))}${rwNgPct !== null ? ` (${rwNgPct.toFixed(1)}%)` : ""}</td></tr>
              <tr><th></th><td></td></tr>
            </table>
          </div>
        </div>
      </div>

      <div class="report-block">
        <h3>${t("report_shipment_section")}</h3>
        <div style="overflow-x:auto;">
        ${shipmentTableHtml(ship, "report-table", true)}
        </div>
      </div>

      <div class="report-block">
        <h3>${t("report_comment")}</h3>
        <textarea id="reportComment" rows="3" placeholder="${t("report_comment_placeholder")}" style="width:100%;border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:9px 10px;font-size:13.5px;font-family:inherit;">${CACHE.report.comment || ""}</textarea>
      </div>
    </div>
  </div>
  `;
}
/* ============================ events & actions ============================ */
/* dbSetDoc is provided by part2.js (server API layer) */

function wireEvents() {
  document.addEventListener("click", handleClick);
  document.addEventListener("change", handleChange);
}

function handleClick(e) {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { STATE.lang = langBtn.dataset.lang; localStorage.setItem("jg_lang", STATE.lang); render(); return; }

  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) { STATE.view = navBtn.dataset.nav; STATE.editing = null; render(); return; }

  const catBtn = e.target.closest("[data-cat]");
  if (catBtn) { STATE.inputCategory = catBtn.dataset.cat; STATE.editing = null; render(); return; }

  const editBtn = e.target.closest("[data-edit-collection]");
  if (editBtn) {
    STATE.editing = { collection: editBtn.dataset.editCollection, id: editBtn.dataset.editId };
    render();
    return;
  }

  const delBtn = e.target.closest("[data-del-collection]");
  if (delBtn) {
    const collection = delBtn.dataset.delCollection;
    const id = delBtn.dataset.delId;
    showModal({
      title: t("confirm_title"),
      body: t("confirm_delete"),
      confirmText: t("delete_confirm_btn"),
      cancelText: t("cancel_btn"),
      danger: true,
      onConfirm: async () => {
        const ok = await dbDelete(collection, id);
        if (ok) {
          showToast(t("toast_deleted"));
          if (STATE.editing && STATE.editing.id === id) STATE.editing = null;
        }
      },
    });
    return;
  }

  const actionBtn = e.target.closest("[data-action]");
  if (actionBtn) { handleAction(actionBtn.dataset.action, actionBtn); return; }
}

function handleChange(e) {
  if (e.target.id === "dateInput") {
    STATE.selectedDate = e.target.value;
    STATE.editing = null;
    render();
    return;
  }
  if (e.target.id === "reportComment") {
    dbSetDoc("meta/report", { comment: e.target.value, updatedAt: new Date().toISOString() }).then(ok => {
      if (ok) showToast(t("toast_saved"));
    });
    return;
  }
}

async function handleAction(action, btn) {
  if (action === "save-simple") {
    const kind = btn.dataset.kind;
    const collection = kind === "normal" ? "production_normal" : "production_decap";
    const input = Number(document.getElementById("simpleInput").value) || 0;
    const ok = Number(document.getElementById("simpleOk").value) || 0;
    const data = { date: STATE.selectedDate, input, ok, updatedAt: new Date().toISOString() };
    const doSave = async () => {
      const saved = await dbSet(collection, STATE.selectedDate, data);
      if (saved) showToast(t("toast_saved"));
    };
    if (ok > input) {
      showModal({
        title: t("confirm_title"),
        body: t("confirm_mismatch").replace("{input}", input).replace("{sum}", ok),
        confirmText: t("confirm_ok"), cancelText: t("confirm_cancel"), onConfirm: doSave,
      });
    } else { await doSave(); }
    return;
  }

  if (action === "save-pm") {
    const caseId = document.getElementById("pmCaseSelect").value;
    STATE.pmCaseSelectValue = caseId;
    const input = Number(document.getElementById("pmInput").value) || 0;
    const scrap = Number(document.getElementById("pmScrap").value) || 0;
    const buckets = {};
    document.querySelectorAll(".pmBucket").forEach(el => { buckets[el.dataset.bucket] = Number(el.value) || 0; });
    const bucketSum = Object.values(buckets).reduce((a, b) => a + b, 0);
    const docId = (STATE.editing && STATE.editing.collection === "pmSelection")
      ? STATE.editing.id : `${STATE.selectedDate}__${caseId}`;
    const data = { date: STATE.selectedDate, caseId, input, scrap, buckets, updatedAt: new Date().toISOString() };
    const doSave = async () => {
      const saved = await dbSet("pmSelection", docId, data);
      if (saved) { showToast(t("toast_saved")); STATE.editing = null; }
    };
    if (bucketSum !== input) {
      showModal({
        title: t("confirm_title"),
        body: t("confirm_mismatch").replace("{input}", input).replace("{sum}", bucketSum),
        confirmText: t("confirm_ok"), cancelText: t("confirm_cancel"), onConfirm: doSave,
      });
    } else { await doSave(); }
    return;
  }

  if (action === "save-rework") {
    const caseId = document.getElementById("rwCaseSelect").value;
    const pmRange = document.getElementById("rwRangeSelect").value;
    STATE.rwCaseSelectValue = caseId; STATE.rwRangeSelectValue = pmRange;
    const input = Number(document.getElementById("rwInput").value) || 0;
    const ok = Number(document.getElementById("rwOk").value) || 0;
    const docId = (STATE.editing && STATE.editing.collection === "sortRework")
      ? STATE.editing.id : `${STATE.selectedDate}__${caseId}__${pmRange}`;
    const data = { date: STATE.selectedDate, caseId, pmRange, input, ok, updatedAt: new Date().toISOString() };
    const doSave = async () => {
      const saved = await dbSet("sortRework", docId, data);
      if (saved) { showToast(t("toast_saved")); STATE.editing = null; }
    };
    if (ok > input) {
      showModal({
        title: t("confirm_title"),
        body: t("confirm_mismatch").replace("{input}", input).replace("{sum}", ok),
        confirmText: t("confirm_ok"), cancelText: t("confirm_cancel"), onConfirm: doSave,
      });
    } else { await doSave(); }
    return;
  }

  if (action === "save-shipment") {
    const type = document.getElementById("shipTypeSelect").value;
    const site = document.getElementById("shipSiteInput").value.trim();
    STATE.shipTypeSelectValue = type; STATE.shipSiteValue = site;
    const normal = Number(document.getElementById("shipNormal").value) || 0;
    const resort67 = Number(document.getElementById("shipResort").value) || 0;
    const decapRework = Number(document.getElementById("shipDecapRw").value) || 0;
    const sortRework = Number(document.getElementById("shipSortRw").value) || 0;
    const docId = (STATE.editing && STATE.editing.collection === "shipment")
      ? STATE.editing.id : `${STATE.selectedDate}__${type}__${sanitizeIdPart(site)}`;
    const data = { date: STATE.selectedDate, type, site, normal, resort67, decapRework, sortRework, updatedAt: new Date().toISOString() };
    const saved = await dbSet("shipment", docId, data);
    if (saved) { showToast(t("toast_saved")); STATE.editing = null; }
    return;
  }

  if (action === "reset-form") { STATE.editing = null; render(); return; }

  if (action === "toggle-targets") { STATE.targetsEditing = !STATE.targetsEditing; render(); return; }

  if (action === "save-targets") {
    const data = {};
    document.querySelectorAll(".targetInput").forEach(el => {
      const v = el.value.trim();
      if (v !== "") data[el.dataset.target] = Number(v) || 0;
    });
    const saved = await dbSetDoc("meta/targets", data);
    if (saved) { showToast(t("toast_saved")); STATE.targetsEditing = false; }
    return;
  }

  if (action === "export-image") { await exportImage(); return; }
  if (action === "export-excel") { await exportExcel(); return; }
}

/* ------------------------------- exports --------------------------------- */
async function exportImage() {
  const el = document.getElementById("reportCapture");
  if (!el || typeof html2canvas === "undefined") { showToast(t("toast_error")); return; }
  showToast(t("exporting"));
  try {
    const bg = getComputedStyle(document.body).backgroundColor;
    const canvas = await html2canvas(el, { backgroundColor: bg, scale: 2, useCORS: true });
    canvas.toBlob((blob) => {
      if (!blob) { showToast(t("toast_error")); return; }
      browserDownload(`report_${todayStr()}.png`, blob);
    }, "image/png");
  } catch (e) { showToast(t("toast_error")); }
}

async function exportExcel() {
  if (typeof XLSX === "undefined") { showToast(t("toast_error")); return; }
  showToast(t("exporting"));
  try {
    const wb = XLSX.utils.book_new();

    const normalRows = Object.keys(CACHE.production_normal).sort().map(date => {
      const r = CACHE.production_normal[date];
      return { date, input: r.input || 0, ok: r.ok || 0 };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalRows), "정규생산");

    const decapRows = Object.keys(CACHE.production_decap).sort().map(date => {
      const r = CACHE.production_decap[date];
      return { date, input: r.input || 0, ok: r.ok || 0 };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(decapRows), "디캡리웍");

    const pmRows = CACHE.pmSelection.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(r => {
      const c = caseById(PM_CASES, r.caseId);
      const b = r.buckets || {};
      return {
        date: r.date, case: c ? c.ko : r.caseId, input: r.input || 0,
        "ge34": b.ge34 || 0, "30_34": b.r30_34 || 0, "28_30": b.r28_30 || 0,
        "25_28": b.r25_28 || 0, "23_25": b.r23_25 || 0, "lt23": b.lt23 || 0,
        "폐기": r.scrap || 0,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pmRows), "PM선별");

    const rwRows = CACHE.sortRework.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(r => {
      const c = caseById(REWORK_CASES, r.caseId);
      const rg = caseById(PM_RANGES, r.pmRange);
      return { date: r.date, case: c ? c.ko : r.caseId, pmRange: rg ? rg.ko : r.pmRange, input: r.input || 0, ok: r.ok || 0 };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rwRows), "선별리웍");

    const shipRows = CACHE.shipment.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(r => {
      const ty = caseById(SHIPMENT_TYPES, r.type);
      return {
        date: r.date, type: ty ? ty.ko : r.type, site: r.site || "",
        normal: r.normal || 0, resort67: r.resort67 || 0, decapRework: r.decapRework || 0, sortRework: r.sortRework || 0,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shipRows), "출하실적");

    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([wbout], { type: "application/octet-stream" });
    browserDownload(`재검진행사항_${todayStr()}.xlsx`, blob);
  } catch (e) { showToast(t("toast_error")); }
}

/* -------------------------------- init ------------------------------------ */
function boot() {
  wireEvents();
  render();
  initDb();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

</script>
